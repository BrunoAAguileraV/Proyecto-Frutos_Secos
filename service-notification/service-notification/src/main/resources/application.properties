spring.application.name=service-notification
server.port=8089

# Conexión a Base de Datos Notificaciones
spring.datasource.url=jdbc:mysql://localhost:3306/db_notifications?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Configuración de Swagger
springdoc.api-docs.path=/api/v1/notifications/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html